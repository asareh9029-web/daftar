<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابداری praw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f4f5;--surface:#fff;--surface2:#f1f1f2;--border:#e0e0e3;--text:#18181b;--muted:#6b6b72;--accent:#18181b;--accent-text:#fff;--side:#111113;--side-text:#e7e7ea;--radius:10px;--fs:14px;--warn:#9a3412}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;font-size:var(--fs);background:var(--bg);color:var(--text);line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
aside{width:230px;flex:none;background:var(--side);color:var(--side-text);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid color-mix(in srgb,var(--side-text) 15%,transparent);margin-bottom:12px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--side-text);color:var(--side);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px}
.brand b{font-size:16px;display:block}
.brand small{color:color-mix(in srgb,var(--side-text) 60%,transparent);font-size:11px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:color-mix(in srgb,var(--side-text) 78%,transparent);text-decoration:none;cursor:pointer;margin-bottom:2px}
nav a:hover{background:color-mix(in srgb,var(--side-text) 9%,transparent);color:var(--side-text)}
nav a.on{background:var(--side-text);color:var(--side);font-weight:500}
nav a svg{width:18px;height:18px;flex:none}
nav .sep{font-size:11px;color:color-mix(in srgb,var(--side-text) 45%,transparent);padding:12px 10px 4px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
header.top h1{font-size:18px;margin:0;font-weight:700}
header.top .sp{flex:1}
header.top .date{color:var(--muted);font-size:13px}
#menuBtn{display:none}
#view{padding:22px 24px 40px;max-width:1400px;width:100%}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card-h h3{margin:0;flex:1}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi small{color:var(--muted);display:block}
.kpi b{font-size:20px;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:calc(var(--radius) - 3px);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.pri:hover{opacity:.88}
.btn.sm{padding:2px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}
.tabs{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:4px 14px;border-radius:calc(var(--radius) - 4px);cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:500}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:12.5px;background:var(--surface2);white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--surface2) 60%,transparent)}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--surface2)}
.empty{color:var(--muted);text-align:center;padding:24px}
.badge{display:inline-block;padding:0 8px;border-radius:20px;font-size:11.5px;border:1px solid var(--border);white-space:nowrap}
a.badge{text-decoration:none;color:inherit}
input[type=range]{accent-color:var(--accent);padding:0;border:0}
input[type=checkbox]{accent-color:var(--accent)}
.badge.dark{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.badge.mid{background:var(--surface2)}
.badge.line{border-style:dashed}
.badge.warn{color:var(--warn);border-color:currentColor}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{color:var(--text)}
input,select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius) - 4px);padding:6px 9px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:0;border-color:var(--accent)}
[hidden]{display:none!important}
#auth{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.authbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.authbox h2{margin:4px 0 0;font-size:18px}
.brand2{display:flex;gap:10px;align-items:center}.brand2 .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:700}.brand2 b{display:block}.brand2 small{color:var(--muted);font-size:11px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}.chk input{width:auto}
.who{margin-top:14px;padding:10px;border-top:1px solid color-mix(in srgb,var(--side-text) 15%,transparent);display:flex;align-items:center;gap:8px;font-size:13px}
.who span{flex:1;color:color-mix(in srgb,var(--side-text) 80%,transparent)}
.who button{background:transparent;color:var(--side-text);border:1px solid color-mix(in srgb,var(--side-text) 25%,transparent);border-radius:7px;padding:2px 10px;cursor:pointer}
.brsel{width:auto;font-weight:500;min-width:170px}
input.amt,input.qty{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.lines td{padding:4px 5px}
.lines input,.lines select{padding:4px 7px}
.totals{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-top:10px}
.totals div{display:flex;gap:20px;min-width:280px;justify-content:space-between}
.totals .big{font-weight:700;font-size:16px;border-top:1px solid var(--border);padding-top:4px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal.hidden{display:none}
.mbox{background:var(--surface);border-radius:var(--radius);width:min(720px,100%);border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.wide{width:min(1050px,100%)}
.mhead{display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border)}
.mhead h3{margin:0;flex:1;font-size:16px}
#mbody{padding:16px 18px}
.mfoot{display:flex;gap:8px;justify-content:flex-start;padding-top:14px;margin-top:6px;border-top:1px solid var(--border)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-text);padding:9px 18px;border-radius:var(--radius);opacity:0;transition:.25s;pointer-events:none;z-index:90;max-width:90vw}
#toast.on{opacity:1}
#toast.err{background:var(--warn);color:#fff}
.dp{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.2);padding:10px;width:250px;display:none}
.dp .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:500}
.dp .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp .g span{font-size:11px;color:var(--muted)}
.dp .g button{border:0;background:transparent;padding:4px 0;border-radius:6px;cursor:pointer}
.dp .g button:hover{background:var(--surface2)}
.dp .g button.on{background:var(--accent);color:var(--accent-text)}
.dp .g button.td{outline:1px solid var(--border)}
.dp .f{display:flex;justify-content:center;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:0 7px;white-space:nowrap}
.recon{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.recon tr.m td{color:var(--muted)}
.recon tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)!important}
.sumbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.sumbar div{background:var(--surface2);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:8px 12px}
.sumbar small{display:block;color:var(--muted);font-size:12px}
.sumbar b{font-variant-numeric:tabular-nums}
.bankcard{border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--surface)}
.pcard{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,var(--bg)));color:var(--accent-text);border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;align-items:center;gap:10px}
.pcard .num{direction:ltr;letter-spacing:1.5px;font-variant-numeric:tabular-nums;flex:1;text-align:left}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{border:2px solid var(--border);border-radius:var(--radius);padding:0;cursor:pointer;width:130px;overflow:hidden;background:none}
.sw.on{border-color:var(--accent);outline:2px solid var(--accent)}
.sw .pv{height:60px;display:flex}
.sw .pv i{flex:1}
.sw div.l{padding:5px;font-size:13px;background:var(--surface)}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.colors label{display:flex;align-items:center;gap:8px;font-size:13px}
.colors input[type=color]{width:38px;height:30px;padding:2px;flex:none}
.ok{color:var(--text)}
.bal-ok{font-weight:700}
.bal-bad{color:var(--warn);font-weight:700}
@media (max-width:900px){
 aside{position:fixed;right:0;top:0;z-index:60;transform:translateX(100%);transition:.2s}
 aside.open{transform:none}
 #menuBtn{display:inline-flex}
 #view{padding:16px}
 header.top .date{display:none}
 header.top .brsel{min-width:0;max-width:150px}
 header.top{gap:6px}
 header.top{padding:12px 16px}
 .recon{grid-template-columns:1fr}
 .two{grid-template-columns:1fr}
 #view{overflow-x:hidden}
 .frow{grid-template-columns:1fr 1fr}
}
@media print{aside,header.top,.toolbar,.btn{display:none!important}#view{padding:0}.card{border:0}}
</style>
</head>
<body>
<div id="app">
 <aside id="side">
  <div class="brand"><div class="logo">P</div><div><b>praw</b><small>حسابداری و مالی</small></div></div>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
 </aside>
 <main>
  <header class="top"><button class="btn ghost" id="menuBtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button><h1 id="ptitle"></h1><div class="sp"></div><select id="brSel" class="brsel" title="بخش" onchange="S.settings.branch=this.value;render()"></select><button class="btn" onclick="exportView()" title="خروجی اکسل از جدول‌های همین صفحه">⤓ خروجی اکسل</button><span class="date" id="tdate"></span></header>
  <section id="view"></section>
 </main>
</div>
<div class="modal hidden" id="modal" onmousedown="if(event.target===this)closeModal()"><div class="mbox" id="mbox"><div class="mhead"><h3 id="mtitle"></h3><button class="btn ghost" onclick="closeModal()">✕</button></div><div id="mbody"></div></div></div>
<div id="toast"></div>
<script>
document.documentElement.dir='rtl';document.documentElement.lang='fa';
/* ===================== ابزارها ===================== */
const LS='praw-accounting-v1';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const FD='۰۱۲۳۴۵۶۷۸۹';
const fa=s=>String(s??'').replace(/\d/g,d=>FD[d]);
const en=s=>String(s??'').replace(/[۰-۹]/g,d=>FD.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const num=s=>{const v=parseFloat(en(s).replace(/[,٬،\s]/g,''));return isNaN(v)?0:v};
const grp=n=>Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const money=n=>{n=Math.round(n||0);return n<0?'('+fa(grp(n).replace(/,/g,'٬'))+')':fa(grp(n).replace(/,/g,'٬'))};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,k)=>a.reduce((s,x)=>s+(typeof k==='function'?k(x):(+x[k]||0)),0);
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
function warn(t){const e=$('#toast');e.textContent=t;e.classList.add('on','err');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on','err'),4200)}
function ask(msg){return new Promise(res=>{const o=document.createElement('div');o.className='modal';o.style.zIndex=70;o.innerHTML=`<div class="mbox" style="width:min(420px,100%)"><div id="ask_b" style="padding:18px"><p style="margin:0 0 14px">${esc(msg)}</p><div class="mfoot"><button class="btn pri" id="ask_y">بله، ادامه</button><button class="btn ghost" id="ask_n">انصراف</button></div></div></div>`;document.body.appendChild(o);const done=v=>{o.remove();res(v)};o.querySelector('#ask_y').onclick=()=>done(true);o.querySelector('#ask_n').onclick=()=>done(false);o.onmousedown=e=>{if(e.target===o)done(false)};o.querySelector('#ask_y').focus()})}
const FRAMED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}

/* ===================== تاریخ شمسی ===================== */
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;const gy2=gm>2?gy+1:gy;let days=365*gy+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)-80+gd+g[gm-1];jy+=33*~~(days/12053);days%=12053;jy+=4*~~(days/1461);days%=1461;jy+=~~((days-1)/365);if(days>365)days=(days-1)%365;const jm=days<186?1+~~(days/31):7+~~((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){let gy=jy<=979?621:1600;jy-=jy<=979?0:979;let days=365*jy+~~(jy/33)*8+~~(((jy%33)+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);gy+=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}gy+=4*~~(days/1461);days%=1461;gy+=~~((days-1)/365);if(days>365)days=(days-1)%365;let gd=days+1;const sa=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13;gm++){if(gd<=sa[gm])break;gd-=sa[gm]}return[gy,gm,gd]}
const pad=n=>String(n).padStart(2,'0');
const jstr=(y,m,d)=>`${y}/${pad(m)}/${pad(d)}`;
function parseJ(s){const m=en(s).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>monthLen(y,mo))return null;return[y,mo,d]}
function today(){const d=new Date();return jstr(...g2j(d.getFullYear(),d.getMonth()+1,d.getDate()))}
function jdays(s){const p=parseJ(s);if(!p)return 0;const [y,m,d]=j2g(...p);return Date.UTC(y,m-1,d)/864e5}
function isLeapJ(y){const b=g2j(...j2g(y,12,30));return b[1]===12&&b[2]===30}
function monthLen(y,m){return m<=6?31:m<=11?30:(isLeapJ(y)?30:29)}
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const fdate=s=>fa(s||'');
function longDate(s){const p=parseJ(s);return p?fa(`${p[2]} ${MONTHS[p[1]-1]} ${p[0]}`):''}

/* تقویم شمسی */
let dp=null,dpIn=null,dpY,dpM;
function openDP(inp){dpIn=inp;const p=parseJ(inp.value)||parseJ(today());dpY=p[0];dpM=p[1];
 if(!dp){dp=document.createElement('div');dp.className='dp';document.body.appendChild(dp);dp.addEventListener('mousedown',e=>e.preventDefault());dp.addEventListener('click',dpClick)}
 renderDP();const r=inp.getBoundingClientRect();dp.style.display='block';
 const top=r.bottom+4+280>innerHeight?Math.max(8,r.top-286):r.bottom+4;dp.style.top=top+'px';dp.style.left=Math.max(8,Math.min(r.right-250,innerWidth-258))+'px'}
function closeDP(){if(dp)dp.style.display='none';dpIn=null}
function renderDP(){const g=j2g(dpY,dpM,1);const first=(new Date(g[0],g[1]-1,g[2]).getDay()+1)%7;const len=monthLen(dpY,dpM);const sel=parseJ(dpIn.value);const t=parseJ(today());
 let h=`<div class="h"><button class="btn sm ghost" data-a="p">›</button><span>${MONTHS[dpM-1]} ${fa(dpY)}</span><button class="btn sm ghost" data-a="n">‹</button></div><div class="g">`;
 'شیدسچپج'.split('').forEach(w=>h+=`<span>${w}</span>`);for(let i=0;i<first;i++)h+='<i></i>';
 for(let d=1;d<=len;d++){const on=sel&&sel[0]===dpY&&sel[1]===dpM&&sel[2]===d;const td=t[0]===dpY&&t[1]===dpM&&t[2]===d;h+=`<button class="${on?'on':''} ${td?'td':''}" data-d="${d}">${fa(d)}</button>`}
 dp.innerHTML=h+`</div><div class="f"><button class="btn sm" data-a="t">امروز</button></div>`}
function dpClick(e){const b=e.target.closest('button');if(!b||!dpIn)return;const a=b.dataset.a;
 if(a==='p'){if(--dpM<1){dpM=12;dpY--}renderDP();return}if(a==='n'){if(++dpM>12){dpM=1;dpY++}renderDP();return}
 const v=a==='t'?today():b.dataset.d?jstr(dpY,dpM,+b.dataset.d):null;if(v){dpIn.value=v;dpIn.dispatchEvent(new Event('input',{bubbles:true}));dpIn.dispatchEvent(new Event('change',{bubbles:true}));closeDP()}}
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('input.jd'))openDP(e.target);else if(dp&&!dp.contains(e.target))closeDP()});
document.addEventListener('mousedown',e=>{if(dp&&dpIn&&!dp.contains(e.target)&&e.target!==dpIn)closeDP()});
document.addEventListener('focusout',e=>{const t=e.target;if(t.matches&&t.matches('input.amt')&&t.value.trim()!==''){t.value=grp(num(t.value))}if(t.matches&&t.matches('input.jd')){const p=parseJ(t.value);if(p)t.value=jstr(...p)}});
const amtVal=n=>n?grp(n):'';

/* ===================== داده‌ها ===================== */
let S;
const DEFAULT_ACCOUNTS=[

function postDoc({date,desc,lines,source,id,branch}){
 lines=lines.filter(l=>(+l.dr||0)>0||(+l.cr||0)>0).map(l=>({lid:l.lid||uid(),acc:l.acc,dr:Math.round(+l.dr||0),cr:Math.round(+l.cr||0),desc:l.desc||'',party:l.party||'',card:l.card||'',ref:l.ref||'',br:l.br!==undefined?l.br:(branch||'')}));

 let doc=source?S.docs.find(d=>d.source&&d.source.type===source.type&&d.source.id===source.id):id?S.docs.find(d=>d.id===id):null;
 if(doc){const keep=new Set(lines.map(l=>l.lid));doc.lines.forEach(l=>{if(!keep.has(l.lid))unmatchKey(l.lid)});Object.assign(doc,{date,desc,lines})}

 const doc=postDoc({date:inv.date,desc:d,lines,branch:inv.branch||'',source:{type:'invoice',id:inv.id}});inv.doc=doc.id;return doc}
function postPayment(p){const inv=S.invoices.find(i=>i.id===p.inv);const isIn=p.dir==='in';const total=sum(p.splits,'amount');
 const base=inv?`${isIn?'دریافت':'پرداخت'} بابت فاکتور ${KIND[inv.kind]} ${fa(inv.no)} - ${partyName(p.party)}`:`${isIn?'دریافت از':'پرداخت به'} ${partyName(p.party)}`;

function runInventory(){const mv=[];let seq=0;const add=m=>{m.seq=seq++;mv.push(m)};
 S.invoices.forEach(inv=>inv.lines.forEach(l=>{const it=itemOf(l.item);if(!it)return;const base={date:inv.date,br:inv.branch||'',inv:inv.id};
  if(inv.kind==='purchase'&&it.type==='goods')add({...base,pri:0,item:it.id,qty:+l.qty,val:(+l.qty)*(+l.price)-(+l.disc||0),desc:`خرید - فاکتور ${fa(inv.no)} ${partyName(inv.party)}`});
  if(inv.kind==='sale'){if(it.type==='goods')add({...base,pri:1,item:it.id,qty:-l.qty,desc:`فروش - فاکتور ${fa(inv.no)}`});
   else if(it.type==='menu')(it.recipe||[]).forEach(r=>{if(itemOf(r.item))add({...base,pri:1,item:r.item,qty:-(l.qty*r.qty),desc:`مصرف در ${it.name} × ${fq(l.qty)} - فاکتور ${fa(inv.no)}`})})}}));
 S.stocks.forEach(sd=>sd.lines.forEach((l,li)=>{const base={date:sd.date,sd:sd.id,item:l.item};
  if(sd.type==='in')add({...base,br:sd.branch,pri:0,qty:+l.qty,val:l.qty*l.cost,desc:STYPE.in+(sd.desc?' - '+sd.desc:'')});
  else if(sd.type==='out')add({...base,br:sd.branch,pri:1,qty:-l.qty,desc:sd.desc||STYPE.out});
  else{const k=sd.id+':'+li;add({...base,br:sd.branch,pri:1,qty:-l.qty,tk:k,desc:'انتقال به '+brName(sd.to)});add({...base,br:sd.to,pri:2,qty:+l.qty,fromTk:k,desc:'انتقال از '+brName(sd.branch)})}}));
 mv.sort((a,b)=>a.date.localeCompare(b.date)||a.pri-b.pri||a.seq-b.seq);
 const pos={},last={},tv={},byInv={},stockVal={},rows=[];
 mv.forEach(m=>{if(!m.qty)return;const k=m.item+'|'+m.br;const p=pos[k]||(pos[k]={q:0,v:0});let val;
  if(m.qty>0){val=m.fromTk?(tv[m.fromTk]||0):m.val;p.q+=m.qty;p.v+=val;last[m.item]=val/m.qty}
  else{const q=-m.qty;const unit=p.q>1e-9?p.v/p.q:(last[m.item]??(itemOf(m.item)?.cost||0));val=unit*q;p.q-=q;p.v=p.q>1e-9?p.v-val:p.q*unit;if(m.tk)tv[m.tk]=val;if(m.inv)byInv[m.inv]=(byInv[m.inv]||0)+val}
  if(m.sd&&!m.fromTk)stockVal[m.sd]=(stockVal[m.sd]||0)+val;rows.push({...m,val})});

function postStock(sd){const val=Math.round(INV().stockVal[sd.id]||0);const d=`${STYPE[sd.type]}${sd.desc?' - '+sd.desc:''} (${brName(sd.branch)}${sd.type==='transfer'?' به '+brName(sd.to):''})`;let lines;

function matchedSets(bid){const bk=new Set,st=new Set,grpOf={};S.matches.filter(m=>m.bank===bid).forEach((m,i)=>{m.book.forEach(k=>{bk.add(k);grpOf[k]=i+1});m.stmt.forEach(k=>{st.add(k);grpOf[k]=i+1})});return{bk,st,grpOf}}
function autoMatch(bid){const {bk,st}=matchedSets(bid);const books=bookLines(bid).filter(l=>!bk.has(l.key));let n=0;
 stmtLines(bid).filter(s=>!st.has(s.id)).forEach(s=>{const cands=books.filter(b=>!b.used&&Math.round(b.amount)===Math.round(s.amount)&&Math.abs(jdays(b.date)-jdays(s.date))<=7);if(!cands.length)return;
  cands.sort((a,b)=>((b.ref&&s.ref&&en(b.ref)===en(s.ref))?1:0)-((a.ref&&s.ref&&en(a.ref)===en(s.ref))?1:0)||Math.abs(jdays(a.date)-jdays(s.date))-Math.abs(jdays(b.date)-jdays(s.date)));
  const c=cands[0];c.used=1;S.matches.push({id:uid(),bank:bid,book:[c.key],stmt:[s.id]});n++});return n}

 if(!parseJ(date))throw new Error('تاریخ معتبر نیست (مثال: ۱۴۰۵/۰۸/۱۲)');if(!$('#iv_party').value)throw new Error('طرف حساب را انتخاب کنید');if(!lines.length)throw new Error('حداقل یک ردیف وارد کنید');
 lines.forEach(l=>{if(!l.desc)l.desc=S.items.find(i=>i.id===l.item)?.name||''});
 const no=num($('#iv_no').value);if(S.invoices.some(i=>i.kind===kind&&+i.no===no&&i.id!==id))throw new Error('این شماره فاکتور قبلاً ثبت شده است');
 let inv=id?S.invoices.find(i=>i.id===id):null;const data={kind,no,date:jstr(...parseJ(date)),party:$('#iv_party').value,branch:$('#iv_br').value,lines,tax:num($('#iv_tax').value),note:$('#iv_note').value};
 if(inv){if(paidOf(inv)>invTotals(data).total)throw new Error('مبلغ جدید فاکتور از مبلغ پرداخت‌شده کمتر است');if((inv.party!==data.party||inv.branch!==data.branch)&&S.payments.some(p=>p.inv===inv.id))throw new Error('برای فاکتوری که پرداخت دارد نمی‌توان طرف حساب یا بخش را تغییر داد');Object.assign(inv,data)}else{inv={id:uid(),...data};S.invoices.push(inv)}
 syncInventory();const doc=S.docs.find(x=>x.id===inv.doc);closeModal();render();toast(`سند شماره ${fa(doc.no)} به صورت خودکار ${id?'به‌روز':'ثبت'} شد`);if(thenPay)payForm(kind==='sale'?'in':'out',inv.id)})}
async function delInv(id){const inv=S.invoices.find(i=>i.id===id);if(S.payments.some(p=>p.inv===id))return warn('ابتدا دریافت/پرداخت‌های این فاکتور را حذف کنید');if(!await ask(`فاکتور ${fa(inv.no)} و سند خودکار آن حذف شود؟`))return;deleteDoc(inv.doc);S.invoices=S.invoices.filter(i=>i.id!==id);syncInventory();render();toast('فاکتور و سند آن حذف شد')}

 <div class="card" style="background:var(--surface2);margin-bottom:10px"><div class="card-h"><h3>منابع ${dir==='in'?'دریافت':'پرداخت'} (چند کارت / حساب)</h3><button class="btn sm" onclick="addSplit()">+ کارت یا حساب دیگر</button></div>

 const def=S.banks[0]&&S.banks[0].cards[0]?`card:${S.banks[0].id}:${S.banks[0].cards[0].id}`:'cash';addSplit(def,invId?remainOf(S.invoices.find(i=>i.id===invId)):0);
 $('#py_inv').onchange=()=>{const i=S.invoices.find(x=>x.id===$('#py_inv').value);if(i){$('#py_party').value=i.party;$('#py_br').value=i.branch||'';const rows=$$('#py_splits tr');if(rows.length===1)rows[0].querySelector('.sp_amt').value=grp(remainOf(i))}payCalc()};
 $('#mbody').oninput=payCalc;payCalc()}
function addSplit(src,amount){const used=$$('#py_splits .sp_src').map(s=>s.value);let s=src;if(!s){const all=['cash'];S.banks.forEach(b=>{b.cards.forEach(c=>all.unshift(`card:${b.id}:${c.id}`))});s=all.find(x=>!used.includes(x))||'cash'}
 $('#py_splits').insertAdjacentHTML('beforeend',`<tr><td><select class="sp_src">${srcOptions(s)}</select></td><td><input class="amt sp_amt" value="${amtVal(amount)}"></td><td><input class="sp_ref" placeholder="اختیاری"></td><td><button class="btn sm" onclick="fillRest(this)">مانده</button></td><td><button class="btn sm ghost" onclick="this.closest('tr').remove();payCalc()">✕</button></td></tr>`);payCalc()}

function savePay(){guard(()=>{const dir=$('#py_dir').value;const invId=$('#py_inv').value;const p=$('#py_party').value;const date=$('#py_date').value;const splits=readSplits().filter(s=>s.amount>0);

 const t=payTarget();const tot=sum(splits,'amount');if(t!==null&&tot>t+0.5)throw new Error(`جمع مبالغ (${money(tot)}) از مانده فاکتور (${money(t)}) بیشتر است`);
 const pay={id:uid(),dir,inv:invId||'',party:p,branch:invId?(S.invoices.find(i=>i.id===invId)?.branch||''):$('#py_br').value,date:jstr(...parseJ(date)),splits};S.payments.push(pay);try{postPayment(pay)}catch(e){S.payments.pop();throw e}

 const bl=bookLines(bid),sl=stmtLines(bid);const {bk,st,grpOf}=matchedSets(bid);const r=reconSummary(bid);const sel=UI.recSel;

 let sd=id?S.stocks.find(x=>x.id===id):null;if(sd)Object.assign(sd,d);else{sd={id:uid(),...d};S.stocks.push(sd)}
 syncInventory();closeModal();render();const doc=S.docs.find(x=>x.id===sd.doc);toast('سند انبار ثبت شد'+(doc?` · سند حسابداری ${fa(doc.no)} خودکار صادر شد`:''))})}

async function saveFile(filename,data){
 filename=filename.replace(/[\u200b-\u200f\u202a-\u202e]/g,'-');
 if(!FRAMED){const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return true}
 let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
 if(!dl){warn('دانلود فایل در این نما در دسترس نیست. برنامه را در مرورگر باز کنید یا از فایل آفلاین استفاده کنید.');return false}
 try{await dl.save({filename,data});return true}catch(e){if(e&&e.code==='declined')toast('دانلود لغو شد');else if(e&&e.code==='rate_limited')warn('یک درخواست دانلود دیگر باز است؛ کمی بعد دوباره امتحان کنید');else warn('دانلود انجام نشد');return false}}

 addSheet(wb,'کاردکس',[['تاریخ','کالا','بخش','شرح','وارده','صادره','فی','مبلغ'],...R.rows.filter(r=>br==='all'||r.br===br).map(r=>[r.date,itemOf(r.item)?.name||'',brName(r.br),r.desc,r.qty>0?+r.qty.toFixed(3):'',r.qty<0?+(-r.qty).toFixed(3):'',Math.round(r.val/Math.abs(r.qty)),Math.round(r.val)])]);
 addSheet(wb,'اسناد انبار',[['تاریخ','نوع','از بخش','به بخش','شرح','کالا','مقدار','فی ورود'],...S.stocks.filter(s=>br==='all'||s.branch===br||s.to===br).flatMap(s=>s.lines.map(l=>[s.date,STYPE[s.type],brName(s.branch),s.to?brName(s.to):'',s.desc,itemOf(l.item)?.name||'',l.qty,l.cost||'']))]);
 addSheet(wb,'کالا و منو',[['نام','نوع','واحد','قیمت فروش','بهای تمام‌شده','دستور تهیه'],...S.items.map(i=>[i.name,ITYPE[i.type],i.unit,i.price||0,Math.round(i.type==='goods'?itemAvg(i.id):i.type==='menu'?recipeCost(i):0),(i.recipe||[]).map(r=>(itemOf(r.item)?.name||'')+' '+r.qty).join('، ')])]);
 addSheet(wb,'اشخاص',[['نام','نوع','تلفن','کد ملی / اقتصادی','مانده (بدهکار +)'],...S.parties.map(p=>[p.name,PTYPE[p.type],p.phone||'',p.code||'',partyBalance(p.id)])]);
 addSheet(wb,'صورتحساب بانک',[['بانک','تاریخ','شرح','مبلغ','شماره پیگیری','وضعیت'],...S.stmts.map(s=>[bank(s.bank)?.name||'',s.date,s.desc,s.amount,s.ref||'',S.matches.some(m=>m.stmt.includes(s.id))?'تطبیق شده':'باز'])]);
 const st=nowStamp();const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});if(await saveFile(`praw_full_${br==='all'?'all':br}_${st.file}.xlsx`,new Blob([buf])))toast('خروجی کامل اکسل ساخته شد')}

/* ===================== ورود، کاربران و رمزگذاری ===================== */
const LSE='praw-accounting-secure-v1',SNAPE='praw-accounting-snapshots-enc';
let VAULT=null,DEK=null,ME=null,saveChain=Promise.resolve(),lastJson='',fails=0,lockUntil=0,idleT;
const te=new TextEncoder(),td=new TextDecoder();
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normU=s=>en(s).trim().toLowerCase();
async function kek(pass,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return{iv:b64(iv),ct:b64(ct)}}
async function dec(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)))}
async function makeUserRec(name,pass,admin){const salt=crypto.getRandomValues(new Uint8Array(16)),iter=250000;const k=await kek(pass,salt,iter);const raw=await crypto.subtle.exportKey('raw',DEK);return{id:uid(),u:normU(name),name:name.trim(),admin:!!admin,salt:b64(salt),iter,wk:await enc(k,raw)}}
function persistVault(){saveChain=saveChain.then(()=>{localStorage.setItem(LSE,JSON.stringify(VAULT))}).catch(e=>{console.warn(e);warn('ذخیره انجام نشد؛ فضای مرورگر پر است. فایل پشتیبان بگیرید.')})}
function save(){if(!DEK||!VAULT||!S)return;const json=JSON.stringify(S);if(json===lastJson)return;lastJson=json;const k=DEK;
 saveChain=saveChain.then(async()=>{VAULT.data=await enc(k,te.encode(json));VAULT.theme=S.settings.theme;localStorage.setItem(LSE,JSON.stringify(VAULT))}).catch(e=>{console.warn(e);warn('ذخیره انجام نشد؛ فضای مرورگر پر است. فایل پشتیبان بگیرید.')});snapshot()}
const saveNow=()=>{lastJson='';save();return saveChain};
/* نسخه‌های خودکار (رمزگذاری‌شده) */
function getSnaps(){try{return JSON.parse(localStorage.getItem(SNAPE)||'[]')}catch(e){return[]}}
const fnv=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+':'+s.length};
function snapshot(reason,force){if(!DEK||!S)return saveChain;const json=JSON.stringify(S);const h=fnv(json);const now=Date.now();const k=DEK;const st=nowStamp();const meta={t:now,date:st.date,time:st.time,reason:reason||'خودکار',docs:S.docs.length,inv:S.invoices.length,h};
 const l0=getSnaps();if(!force&&l0[0]&&(now-l0[0].t<30*60e3||l0[0].h===h))return saveChain;
 saveChain=saveChain.then(async()=>{const l=getSnaps();if(!force&&l[0]&&(now-l[0].t<30*60e3||l[0].h===h))return;meta.enc=await enc(k,te.encode(json));l.unshift(meta);while(l.length>15)l.pop();
  try{localStorage.setItem(SNAPE,JSON.stringify(l))}catch(e){l.splice(4);try{localStorage.setItem(SNAPE,JSON.stringify(l))}catch(_){}}}).catch(e=>console.warn(e));return saveChain}
async function snapData(i){const s=getSnaps()[i];return s?JSON.parse(td.decode(await dec(DEK,s.enc))):null}
async function restoreSnap(i){const s=getSnaps()[i];if(!s)return;if(!await ask(`اطلاعات به نسخه ${fa(s.date)} ساعت ${fa(s.time)} برگردد؟ از وضعیت فعلی هم یک نسخه نگه داشته می‌شود.`))return;const d=await snapData(i);await snapshot('قبل از بازگردانی نسخه',true);S=migrate(d);_inv=null;render();toast('نسخه بازگردانی شد')}
async function downloadSnap(i){const s=getSnaps()[i];if(!s)return;const d=await snapData(i);await saveFile(`praw-backup_${s.date.replace(/\//g,'-')}_${s.time.replace(':','')}.json`,JSON.stringify({app:'praw-accounting',savedAt:s.date+' '+s.time,data:d}))}
/* صفحه ورود */
const defTheme=()=>({preset:'light',colors:{...PRESETS.light},radius:10,fs:14});
function authScreen(mode,msg){applyTheme(VAULT&&VAULT.theme||defTheme());$('#app').hidden=true;closeModal();let a=$('#auth');if(!a){a=document.createElement('div');a.id='auth';$('#app').parentNode.appendChild(a)}a.hidden=false;
 let hasOld=false;try{hasOld=!!localStorage.getItem(LS)}catch(e){}
 a.innerHTML=`<form class="authbox" onsubmit="event.preventDefault();${mode==='setup'?'doSetup()':'doLogin()'}"><div class="brand2"><div class="logo">P</div><div><b>praw</b><small>حسابداری و مالی</small></div></div>
 <h2>${mode==='setup'?'ساخت حساب مدیر':'ورود به نرم‌افزار'}</h2>
 ${mode==='setup'?'<p class="muted" style="margin:0">برای اولین ورود یک نام کاربری و رمز عبور برای مدیر بسازید. اطلاعات نرم‌افزار با همین رمز رمزگذاری می‌شود و رمز قابل بازیابی نیست، پس آن را جای امنی یادداشت کنید.</p>':''}
 <label class="f">نام کاربری<input id="au_u" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
 <label class="f">رمز عبور<input id="au_p" type="password" autocomplete="${mode==='setup'?'new-password':'current-password'}"></label>
 ${mode==='setup'?`<label class="f">تکرار رمز عبور<input id="au_p2" type="password" autocomplete="new-password"></label>${hasOld?'<label class="chk"><input type="checkbox" id="au_wipe" checked> اطلاعات نمونه قبلی پاک شود و دفاتر از صفر شروع شود</label>':''}`:''}
 <div id="au_msg" class="bal-bad" role="alert">${esc(msg||'')}</div>
 <button class="btn pri" style="justify-content:center;padding:9px" id="au_btn">${mode==='setup'?'ساخت حساب و ورود':'ورود'}</button></form>`;
 setTimeout(()=>{const f=$('#au_u');f&&f.focus()},30)}
async function doLogin(){const m=$('#au_msg');if(Date.now()<lockUntil){m.textContent='چند ثانیه بعد دوباره امتحان کنید';return}const u=normU($('#au_u').value),p=$('#au_p').value;const rec=VAULT.users.find(x=>x.u===u);$('#au_btn').disabled=true;m.textContent='در حال ورود…';
 try{if(!rec)throw 0;const k=await kek(p,unb64(rec.salt),rec.iter);const raw=await dec(k,rec.wk);DEK=await crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);const data=JSON.parse(td.decode(await dec(DEK,VAULT.data)));ME=rec;fails=0;S=migrate(data);enterApp()}
 catch(e){DEK=null;fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}m.textContent='نام کاربری یا رمز عبور اشتباه است';$('#au_btn').disabled=false;$('#au_p').select()}}
async function doSetup(){const m=$('#au_msg');const u=$('#au_u').value.trim(),p=$('#au_p').value,p2=$('#au_p2').value;
 if(normU(u).length<3){m.textContent='نام کاربری حداقل ۳ حرف باشد';return}if(p.length<6){m.textContent='رمز عبور حداقل ۶ کاراکتر باشد';return}if(p!==p2){m.textContent='رمز عبور و تکرار آن یکسان نیست';return}
 $('#au_btn').disabled=true;m.textContent='';
 DEK=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
 let old=null;try{const r=localStorage.getItem(LS);if(r)old=JSON.parse(r)}catch(e){}
 VAULT={v:1,users:[],theme:null,data:null};const rec=await makeUserRec(u,p,true);VAULT.users.push(rec);ME=rec;
 if(old){S=migrate(old);if($('#au_wipe')&&$('#au_wipe').checked){await snapshot('اطلاعات نمونه قبل از صفر کردن',true);const th=S.settings.theme;S=blank();S.settings.theme=th}}else S=blank();
 await saveNow();try{localStorage.removeItem(LS);localStorage.removeItem(SNAP)}catch(e){}enterApp();toast('حساب مدیر ساخته شد. خوش آمدید')}
function enterApp(){const a=$('#auth');if(a)a.hidden=true;$('#app').hidden=false;lastJson=JSON.stringify(S);route='dashboard';_inv=null;render();armIdle()}
function lock(msg){DEK=null;S=null;ME=null;lastJson='';_inv=null;closeModal();authScreen('login',msg)}
async function logout(){await saveChain;lock()}
function armIdle(){clearTimeout(idleT);idleT=setTimeout(()=>{if(DEK)saveChain.then(()=>lock('به دلیل ۲۰ دقیقه عدم فعالیت از نرم‌افزار خارج شدید'))},20*60e3)}
['mousedown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(DEK)armIdle()},{passive:true}));
function boot(){if(!window.crypto||!crypto.subtle){$('#app').innerHTML='<div class="card" style="margin:20px">این مرورگر از رمزگذاری پشتیبانی نمی‌کند. لطفاً نسخه جدید Chrome، Edge یا Firefox را استفاده کنید.</div>';return}
 try{VAULT=JSON.parse(localStorage.getItem(LSE)||'null')}catch(e){VAULT=null}authScreen(VAULT&&VAULT.users&&VAULT.users.length?'login':'setup')}
/* مدیریت کاربران */
function usersCard(){let h=`<div class="card"><h3>کاربران و رمز عبور</h3><p class="muted" style="margin-top:0">اطلاعات با رمز عبور کاربران رمزگذاری و در همین مرورگر ذخیره می‌شود. بعد از ۲۰ دقیقه عدم فعالیت، خروج خودکار انجام می‌شود. رمز فراموش‌شده قابل بازیابی نیست، مگر اینکه یک مدیر دیگر آن را عوض کند.</p>`;
 h+=table(['نام کاربری','نقش',''],VAULT.users.map(u=>`<tr><td>${esc(u.name)}${u.id===ME.id?' <span class="badge">شما</span>':''}</td><td>${u.admin?'<span class="badge dark">مدیر</span>':'<span class="badge">کاربر</span>'}</td><td style="white-space:nowrap">${ME.admin||u.id===ME.id?`<button class="btn sm" onclick="pwForm('${u.id}')">تغییر رمز</button>`:''} ${ME.admin&&u.id!==ME.id?`<button class="btn sm ghost danger" onclick="delUser('${u.id}')">حذف</button>`:''}</td></tr>`));
 return h+(ME.admin?`<div class="toolbar" style="margin-top:10px"><button class="btn" onclick="userForm()">+ کاربر جدید</button></div>`:'')+'</div>'}
function userForm(){openModal('کاربر جدید',`<form onsubmit="event.preventDefault();saveUser()"><div class="frow"><label class="f">نام کاربری<input id="uf_u" autocomplete="off" autocapitalize="off"></label><label class="f">رمز عبور<input id="uf_p" type="password" autocomplete="new-password"></label><label class="f">تکرار رمز عبور<input id="uf_p2" type="password" autocomplete="new-password"></label></div><label class="chk"><input type="checkbox" id="uf_admin"> مدیر باشد (مدیریت کاربران و پاک کردن اطلاعات)</label><div class="mfoot"><button class="btn pri">ساخت کاربر</button><button type="button" class="btn ghost" onclick="closeModal()">انصراف</button></div></form>`)}
async function saveUser(){const u=$('#uf_u').value.trim(),p=$('#uf_p').value;if(normU(u).length<3)return warn('نام کاربری حداقل ۳ حرف باشد');if(VAULT.users.some(x=>x.u===normU(u)))return warn('این نام کاربری قبلاً ساخته شده است');if(p.length<6)return warn('رمز عبور حداقل ۶ کاراکتر باشد');if(p!==$('#uf_p2').value)return warn('رمز عبور و تکرار آن یکسان نیست');
 VAULT.users.push(await makeUserRec(u,p,$('#uf_admin').checked));persistVault();closeModal();render();toast('کاربر ساخته شد')}
function pwForm(id){const u=VAULT.users.find(x=>x.id===id);openModal('تغییر رمز «'+u.name+'»',`<form onsubmit="event.preventDefault();savePw('${id}')"><div class="frow"><label class="f">رمز جدید<input id="pw_p" type="password" autocomplete="new-password"></label><label class="f">تکرار رمز جدید<input id="pw_p2" type="password" autocomplete="new-password"></label></div><div class="mfoot"><button class="btn pri">ذخیره رمز</button><button type="button" class="btn ghost" onclick="closeModal()">انصراف</button></div></form>`)}
async function savePw(id){const p=$('#pw_p').value;if(p.length<6)return warn('رمز عبور حداقل ۶ کاراکتر باشد');if(p!==$('#pw_p2').value)return warn('رمز عبور و تکرار آن یکسان نیست');const i=VAULT.users.findIndex(x=>x.id===id);const old=VAULT.users[i];const rec=await makeUserRec(old.name,p,old.admin);rec.id=old.id;VAULT.users[i]=rec;if(ME.id===id)ME=rec;persistVault();closeModal();render();toast('رمز عبور عوض شد')}
async function delUser(id){if(!VAULT.users.some(x=>x.admin&&x.id!==id))return warn('حداقل یک مدیر باید بماند');if(!await ask('این کاربر حذف شود؟'))return;VAULT.users=VAULT.users.filter(x=>x.id!==id);persistVault();render();toast('کاربر حذف شد')}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(dp&&dp.style.display==='block')closeDP();else closeModal()}});
boot();
</script>
